apiVersion: grp.keti.re.kr/v1alpha1
kind: PlanRequest
metadata: {name: train3d-reserved-plan}
spec:
  requestId: req-train3d-mig-reserved-0001
  source: file
  workloadRef: train3d-reserved
  runtime: pytorch-3d
  parallelism: {dp: 1, tp: 2, pp: 2}
  profiling:
    workloadType: training
    weightsGb: 0.1
    gradientsGb: 0.1
    optimizerGb: 0.2
    activationGbPerSample: 0.0001
    globalBatch: 1024
  poolSnapshot: k8s:gpuresourcepools/gpu-pool
  allocation:
    reservation:
      apiVersion: keti.poolmanager/v0.1
      kind: ReservationResult
      request_id: sched-train3d-0001
      candidate_id: cand-train3d-mig4
      ok: true
      reason: null
      placements:
        - {node_id: gpu-node-a, gpu_id: GPU0, profile: 1g.24gb, placement: 6}
        - {node_id: gpu-node-a, gpu_id: GPU0, profile: 1g.24gb, placement: 0}
        - {node_id: gpu-node-a, gpu_id: GPU0, profile: 1g.24gb, placement: 9}
        - {node_id: gpu-node-a, gpu_id: GPU0, profile: 1g.24gb, placement: 3}
  launch:
    script: workloads/train_3d.py
    args: [--max-steps, "2000", --hidden, "1024", --layers, "8", --micro-batches, "4"]
    cpu: "1500m"
    memory: 4Gi
    gpu: 1
    runtimeClass: nvidia
    image: pytorch-cuda:dev
    python: /opt/venvs/grp-runtime/bin/python
    hostRoot: /opt/grp-runtime
    hostMounts:
      - /opt/venvs/grp-runtime
      - /opt/venvs/torch
    env:
      PYTHONPATH: /work/src
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
