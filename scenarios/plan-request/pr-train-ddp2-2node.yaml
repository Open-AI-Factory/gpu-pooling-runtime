apiVersion: grp.keti.re.kr/v1alpha1
kind: PlanRequest
metadata: {name: ddp2x-plan}
spec:
  requestId: req-ddp2x-0001
  source: file
  workloadRef: ddp2x
  runtime: ddp
  parallelism: {dp: 2, tp: 1, pp: 1}
  profiling:
    workloadType: training
    weightsGb: 0.0196
    gradientsGb: 0.0196
    optimizerGb: 0.0391
    activationGbPerSample: 0.000035
    globalBatch: 1024
  poolSnapshot: k8s:gpuresourcepools/gpu-pool
  allocation:
    gpuIds:
      - MIG-00000000-0000-4000-8000-000000000001
      - GPU-00000000-0000-4000-8000-0000000000b0
  launch:
    script: workloads/train_ddp.py
    settings: {effectiveBatch: 1024, maxMicroBatch: 256}
    args: [--max-steps, "1000000", --step-sleep, "0.05"]
    cpu: "1"
    memory: 4Gi
    gpu: 1
    runtimeClass: nvidia
    image: pytorch-cuda:dev
    python: /opt/venvs/grp-runtime/bin/python
    hostRoot: /opt/grp-runtime
    hostMounts:
      - /opt/venvs/grp-runtime
      - /opt/venvs/torch
    env:
      PYTHONPATH: /work/src
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
