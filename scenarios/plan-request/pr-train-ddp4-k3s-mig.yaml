apiVersion: grp.keti.re.kr/v1alpha1
kind: PlanRequest
metadata: {name: ddp4-plan}
spec:
  requestId: req-ddp4-mig-0001
  source: file
  workloadRef: ddp4
  runtime: ddp
  parallelism: {dp: 4, tp: 1, pp: 1}
  profiling:
    workloadType: training
    weightsGb: 0.0196
    gradientsGb: 0.0196
    optimizerGb: 0.0391
    activationGbPerSample: 0.000035
    globalBatch: 1024
  poolSnapshot: k8s:gpuresourcepools/gpu-pool
  launch:
    script: workloads/train_ddp.py
    args: [--max-steps, "1000000", --step-sleep, "0.05"]
    cpu: "1"
    memory: 4Gi
    gpu: 1
    runtimeClass: nvidia
    image: pytorch-cuda:dev
    python: /opt/venvs/grp-runtime/bin/python
    hostRoot: /opt/grp-runtime
    hostMounts:
      - /opt/venvs/grp-runtime
      - /opt/venvs/torch
    env:
      PYTHONPATH: /work/src
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
