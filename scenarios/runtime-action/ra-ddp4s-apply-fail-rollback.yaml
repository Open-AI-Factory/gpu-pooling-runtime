apiVersion: grp.keti.re.kr/v1alpha1
kind: RuntimeAction
metadata: {name: ra-ddp4s-apply-fail-rollback}
spec:
  executionPlanRef: ddp4s-plan
  action: ApplySettings
  target:
    settings: {profileConfigMap: train-ddp-profiles}
  safePolicy: {mode: WaitSafePoint, timeoutSeconds: 120}
  adapterOptions: {failAt: Reconfigure}
