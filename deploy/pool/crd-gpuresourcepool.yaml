  scope: Cluster
  names:
    kind: GpuResourcePool
    plural: gpuresourcepools
    singular: gpuresourcepool
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
